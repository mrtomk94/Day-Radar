services:
  - type: web
    name: day-radar
    runtime: node
    region: oregon
    plan: starter          # gói free ngủ khi không ai mở web -> không quét được
    buildCommand: "true"
    startCommand: node server.js
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: APP_PASSWORD
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
