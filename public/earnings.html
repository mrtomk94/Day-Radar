<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ARROW = { up: '<svg width="14" height="12" viewBox="0 0 14 12" aria-hidden="true"><path d="M7 0l7 12H0z" fill="currentColor"/></svg>', down: '<svg width="14" height="12" viewBox="0 0 14 12" aria-hidden="true"><path d="M7 12L0 0h14z" fill="currentColor"/></svg>', flat: '<svg width="14" height="12" viewBox="0 0 14 12" aria-hidden="true"><rect y="5" width="14" height="3" rx="1.5" fill="currentColor"/></svg>' };
const ORDER = ['MSFT', 'GOOGL', 'META', 'AMZN', 'AAPL', 'NVDA', 'TSLA', 'NFLX', 'AMD', 'PLTR', 'SOFI', 'MARA', 'MU', 'SPCX'];
const BY = Object.fromEntries(REPORTS.map(r => [r.t, r]));

function chips(active) {
  $('#chips').innerHTML = `<a class="chip ${!active ? 'on' : ''}" href="#tong-quan">Tổng quan</a>` +
    ORDER.map(t => `<a class="chip ${active === t ? 'on' : ''}" href="#${t}"><i class="d-${BY[t].view}"></i>${t}</a>`).join('');
  const on = $('#chips .on'); if (on) on.scrollIntoView({ block: 'nearest', inline: 'center' });
}

function overview() {
  const rows = ORDER.map(t => {
    const r = BY[t], k0 = r.kpi[0], k1 = r.kpi[1];
    return `<tr data-t="${t}"><td><span class="tk">${t}</span><span class="nm">${esc(r.name)}</span></td><td>${esc(r.q)}</td>
      <td class="num">${esc(k0.value)} <span class="${k0.dir}">${esc(k0.chg)}</span></td>
      <td class="num">${esc(k1.value)} <span class="${k1.dir}">${esc(k1.chg)}</span></td>
      <td><span class="pill p-${r.view}">${esc(r.viewLabel)}</span></td>
      <td>${esc(r.next || '—')}</td></tr>`;
  }).join('');
  return `<section class="overview"><h2>Tổng quan 14 mã</h2>
    <p>Mỗi dòng là quý gần nhất mà công ty đã công bố. Bấm vào một mã để xem báo cáo chi tiết. Đánh giá là tóm tắt chất lượng của quý (so với dự báo, hướng dẫn và rủi ro), không phải khuyến nghị mua bán.</p>
    <div class="scrollx"><table class="ov"><thead><tr><th>Mã</th><th>Quý</th><th>Doanh thu</th><th>EPS</th><th>Đánh giá</th><th>Báo cáo tới</th></tr></thead><tbody>${rows}</tbody></table></div></section>
    <div class="optnote"><b>Quyền chọn bất thường</b> (giống Ripple) nằm trong Stock Radar, tab Báo cáo: lấy chuỗi quyền chọn trễ ~15 phút từ Cboe cho cả 14 mã và tự cập nhật mỗi giờ trong phiên. Trang này là bản tổng hợp tĩnh nên không có dữ liệu trực tiếp.</div>
    <p class="disclaimer">Số liệu tổng hợp từ thông cáo của công ty (SEC 8-K) và báo tài chính; nguồn ghi cuối mỗi báo cáo. Đây là tài liệu nghiên cứu, không phải lời khuyên đầu tư.</p>`;
}

const TABS = [['tq', 'Tổng quan'], ['lq', 'Lạc quan'], ['rr', 'Rủi ro'], ['sl', 'Số liệu'], ['hd', 'Hướng dẫn']];
let sub = 'tq';
function report(r) {
  const kpis = r.kpi.map(k => `<div class="kpi"><div class="lbl">${esc(k.label)}</div><div class="val num">${esc(k.value)}</div>
    <div class="chg ${k.dir}">${ARROW[k.dir]}${esc(k.chg)}</div>${k.note ? `<div class="note">${esc(k.note)}</div>` : ''}</div>`).join('');
  const list = (arr, cls) => `<ol class="items ${cls}">${arr.map((x, i) => `<li><span class="n">${i + 1}</span><div><b>${esc(x[0])}</b><span>${esc(x[1])}</span></div></li>`).join('')}</ol>`;
  const seg = `<div class="scrollx"><table class="dt num"><thead><tr>${r.seg.head.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${r.seg.rows.map(row => `<tr><td class="k">${esc(row[0])}</td><td>${esc(row[1])}</td><td class="${/^[+]/.test(row[2]) ? 'up' : /^[−-]/.test(row[2]) ? 'down' : ''}">${esc(row[2])}</td></tr>`).join('')}</tbody></table></div>`;
  const kv = `<div class="kv num">${r.other.map(([a, b]) => `<div>${esc(a)}</div><div>${esc(b)}</div>`).join('')}</div>`;
  const panels = {
    tq: `<div class="verdict-box"><div class="verdict-h"><small>ĐÁNH GIÁ QUÝ</small><span class="vpill v-${r.view}">${esc(r.viewLabel)}</span></div><p>${esc(r.summary)}</p></div>
      <div class="kpis">${kpis}</div>
      <div class="meta2"><span>${esc(r.period)}</span><span>Công bố <b>${esc(r.date)}</b></span>${r.next ? `<span>Báo cáo tới <b>${esc(r.next)}</b></span>` : ''}</div>`,
    lq: `<h3 class="ph"><span class="badge b-up"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3 3 7-7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>${r.bull.length} lý do lạc quan <small>Động lực tăng trưởng chính</small></h3>${list(r.bull, 'bull')}`,
    rr: `<h3 class="ph"><span class="badge b-down"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5L14.5 13.5h-13z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M8 6.5v3.2M8 11.6v.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>${r.bear.length} rủi ro cần lưu ý <small>Những yếu tố có thể tác động</small></h3>${list(r.bear, 'bear')}`,
    sl: `<div class="tables"><div class="tbox"><h4>${esc(r.seg.title)}</h4>${seg}</div><div class="tbox"><h4>Các chỉ số khác</h4>${kv}</div></div>`,
    hd: `<div class="guide"><span class="gi"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M9 11h7M9 15h7M9 19h4"/></svg></span><h5>${esc(r.guide.title)}</h5>
      <div class="gitems">${r.guide.items.map(([l, v, x]) => `<div class="gitem"><div class="l">${esc(l)}</div><div class="v num">${esc(v)}</div>${x ? `<div class="x">${esc(x)}</div>` : ''}</div>`).join('')}</div></div>
      <div class="foot"><ul>${r.notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul>
      <div class="src">Nguồn${r.src.map(([n, u]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(n)}</a>`).join('')}</div></div>
      <p class="disclaimer">Đây là tài liệu nghiên cứu, không phải lời khuyên đầu tư.</p>`,
  };
  return `<article class="sheet" aria-labelledby="co-${r.t}">
    <div class="hero">
      <div class="title"><h2 class="co" id="co-${r.t}">${esc(r.name)}</h2><span class="tick">(${esc(r.t)})</span><span class="qbadge">${esc(r.q)}</span></div>
      <div class="tags">${r.tags.map(t => `<span>${esc(t)}</span>`).join('')}</div>
    </div>
    <div class="tabs" role="tablist">${TABS.map(([k, l]) => `<button role="tab" aria-selected="${sub === k}" class="tab ${sub === k ? 'on' : ''}" data-sub="${k}">${l}</button>`).join('')}</div>
    <div class="panel" role="tabpanel">${panels[sub]}</div>
    <div class="pager"><button class="pg" data-step="-1" ${TABS[0][0] === sub ? 'disabled' : ''}>← Trước</button><span>${TABS.findIndex(t => t[0] === sub) + 1} / ${TABS.length}</span><button class="pg" data-step="1" ${TABS[TABS.length - 1][0] === sub ? 'disabled' : ''}>Tiếp →</button></div>
  </article>`;
}

function show() {
  const h = decodeURIComponent(location.hash.slice(1)).toUpperCase();
  const r = BY[h];
  chips(r ? r.t : null);
  $('#main').innerHTML = r ? report(r) : overview();
  if (!r) document.querySelectorAll('.ov tbody tr').forEach(tr => tr.addEventListener('click', () => { location.hash = tr.dataset.t; }));
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-sub],[data-step]');
  if (!b) return;
  if (b.dataset.sub) sub = b.dataset.sub;
  else { const i = TABS.findIndex(t => t[0] === sub) + +b.dataset.step; sub = TABS[Math.max(0, Math.min(TABS.length - 1, i))][0]; }
  show();
});
document.addEventListener('keydown', e => {
  if (!BY[decodeURIComponent(location.hash.slice(1)).toUpperCase()] || e.target.closest('input,textarea')) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { const i = TABS.findIndex(t => t[0] === sub) + (e.key === 'ArrowRight' ? 1 : -1); if (i >= 0 && i < TABS.length) { sub = TABS[i][0]; show(); } }
});
window.addEventListener('hashchange', () => { show(); window.scrollTo(0, 0); });
show();
</script>
