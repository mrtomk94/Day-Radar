# Chế độ miễn phí: GitHub tự chạy quét mỗi 15 phút trong giờ giao dịch rồi đăng kết quả lên GitHub Pages.
# Repo cần để Public thì GitHub Pages mới miễn phí.
name: Day Radar scan

on:
  schedule:
    - cron: "*/15 13-21 * * 1-5"   # giờ UTC, bao trùm 9:30–16:00 New York cả mùa hè lẫn mùa đông; GitHub có thể chạy trễ vài phút
    - cron: "0 3 * * *"            # 1 lần ban đêm để làm mới báo cáo
  workflow_dispatch:
    inputs:
      force:
        description: "Quét ngay cả khi thị trường đóng"
        type: boolean
        default: true
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Lấy dữ liệu lần trước
        run: node tools/restore.js "${{ steps.pages.outputs.base_url }}"
      - name: Quét
        run: node server.js --once ${{ (github.event_name != 'schedule' && inputs.force != false) && '--force' || '' }}
        env:
          DATA_DIR: public/data
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: public
      - name: Đăng lên GitHub Pages
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
